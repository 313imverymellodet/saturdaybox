<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATURDAYBOX</title>
<meta name="theme-color" content="#160d2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --grape:#2a1a4a;--grape-deep:#160d2b;--sherbet:#ff6ad5;
    --tang:#ffb627;--aqua:#3ff0c8;--static:#c8c0d8;
    --wood-1:#6a5430;--wood-2:#3a2e18;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(circle at 50% 18%, #432a72 0%, var(--grape-deep) 62%),
      var(--grape-deep);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'VT323',monospace;color:var(--static);overflow-x:hidden;padding:2rem 1rem;
    -webkit-tap-highlight-color:transparent;
  }
  /* faint drifting starfield / dust */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;
    background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),
      radial-gradient(1px 1px at 70% 60%,#fff,transparent),
      radial-gradient(1px 1px at 40% 80%,#fff,transparent),
      radial-gradient(1px 1px at 90% 20%,#fff,transparent),
      radial-gradient(1px 1px at 10% 70%,#fff,transparent);
    background-size:100% 100%;animation:drift 60s linear infinite;
  }
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-40px)}}

  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}

  .logo{font-family:'Bungee',sans-serif;font-size:clamp(2rem,8vw,4.5rem);line-height:.95;
    text-align:center;margin-bottom:.4rem;letter-spacing:.02em;user-select:none;}
  .logo .sat{color:var(--tang);text-shadow:4px 4px 0 var(--sherbet)}
  .logo .box{color:var(--aqua);text-shadow:4px 4px 0 var(--grape)}
  .tagline{font-size:clamp(1rem,3vw,1.4rem);color:var(--sherbet);margin-bottom:1.6rem;
    letter-spacing:.15em;text-transform:uppercase;text-align:center;user-select:none;}

  .tv{width:min(94vw,680px);
    background:linear-gradient(160deg,var(--wood-1),var(--wood-2));
    border-radius:30px;padding:26px 26px 26px;position:relative;
    box-shadow:0 0 0 4px #1a140a,0 30px 70px rgba(0,0,0,.65),inset 0 2px 4px rgba(255,255,255,.18);}
  /* wood grain hint */
  .tv::before{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;opacity:.12;
    background:repeating-linear-gradient(95deg,transparent 0 7px,rgba(0,0,0,.5) 7px 8px);}

  .deck{display:flex;gap:18px;align-items:stretch}
  .screen-bay{flex:1;min-width:0}

  .screen{position:relative;aspect-ratio:4/3;background:#05040a;border-radius:18px;
    overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.9),inset 0 0 8px rgba(0,0,0,1);}
  .screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
    transition:filter .3s;}
  .screen.powered-off video{filter:brightness(0)}

  /* on-screen overlays */
  .feed{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:1rem;background:#05040a;transition:opacity .4s;}
  .feed.hidden{opacity:0;pointer-events:none}
  .feed .show-title{font-family:'Bungee',sans-serif;font-size:clamp(1.2rem,5vw,2.2rem);margin-bottom:.5rem;color:var(--tang)}
  .feed .show-sub{font-size:clamp(1rem,3.5vw,1.4rem);opacity:.85}

  /* analog static layer (canvas) */
  #static{position:absolute;inset:0;z-index:4;width:100%;height:100%;opacity:0;
    transition:opacity .18s;pointer-events:none;mix-blend-mode:screen;}
  #static.on{opacity:.9}

  /* scanlines + vignette + flicker */
  .screen .scan{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,.22) 4px);}
  .screen .vig{position:absolute;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55) 100%);animation:flicker .15s infinite;}
  /* curved glass glare */
  .screen .glare{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:18px;
    background:linear-gradient(125deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 32%);}
  @keyframes flicker{0%,100%{opacity:.97}50%{opacity:1}}

  /* channel-change flash */
  .screen .flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none;}
  .screen .flash.go{animation:chflash .35s ease-out}
  @keyframes chflash{0%{opacity:.85}100%{opacity:0}}

  /* HUD */
  .channel-label{position:absolute;top:12px;right:16px;z-index:9;font-size:1.3rem;
    color:var(--aqua);text-shadow:0 0 6px var(--aqua);letter-spacing:.05em;user-select:none;}
  .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b3b;
    margin-right:6px;animation:pulse 1.2s infinite;vertical-align:middle}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* big channel number bug when surfing */
  .ch-bug{position:absolute;top:12px;left:16px;z-index:9;font-family:'Bungee',sans-serif;
    font-size:2rem;color:var(--tang);text-shadow:0 0 10px rgba(255,182,39,.7);
    opacity:0;transition:opacity .25s;user-select:none;}
  .ch-bug.show{opacity:1}

  /* TV GUIDE overlay */
  .guide{position:absolute;inset:0;z-index:10;background:rgba(8,4,20,.94);
    display:flex;flex-direction:column;padding:14px 16px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .guide.open{opacity:1;pointer-events:auto}
  .guide h2{font-family:'Bungee',sans-serif;color:var(--sherbet);font-size:1.1rem;margin-bottom:.4rem;flex:0 0 auto}
  .guide .rows{overflow-y:auto;flex:1 1 auto;scrollbar-width:thin}
  .guide-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;font-size:1.15rem;
    cursor:pointer;border:1px solid transparent;line-height:1.1}
  .guide-row:hover{background:rgba(255,255,255,.06)}
  .guide-row.live{border-color:var(--aqua);background:rgba(63,240,200,.08)}
  .guide-row .gch{color:var(--aqua);min-width:2.4em}
  .guide-row .gtt{color:var(--static);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .guide-row .gnow{color:#ff3b3b;font-size:.8em;letter-spacing:.1em}

  /* control rail (right of screen) */
  .rail{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:6px 0;}
  .brand-plate{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Bungee',sans-serif;
    font-size:.7rem;color:#1a140a;opacity:.55;letter-spacing:.15em;margin-top:auto;user-select:none;}
  .pbtn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#5a5a5a,#161616);
    box-shadow:0 3px 5px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.35);
    color:var(--static);font-size:1.2rem;display:grid;place-items:center;transition:transform .08s, color .2s;}
  .pbtn:active{transform:translateY(2px)}
  .pbtn .ico{font-family:'VT323',monospace;font-size:1.4rem;line-height:1}
  .pbtn.power{color:#ff5a5a}
  .pbtn.power.on{color:var(--aqua)}
  .pbtn small{display:block;font-size:.55rem;color:#cdbfae;margin-top:2px}

  /* knobs row under screen */
  .knobs{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:14px}
  .knob-cluster{display:flex;gap:18px;align-items:center}
  .knob{width:34px;height:34px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 35%,#999,#222);
    box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.3);position:relative;transition:transform .1s}
  .knob::after{content:"";position:absolute;top:4px;left:50%;width:3px;height:11px;background:#eee;border-radius:2px;transform:translateX(-50%)}
  .knob:active{transform:scale(.94)}
  .knob-lbl{font-size:.85rem;text-align:center;color:#1a140a;opacity:.7;margin-top:2px;font-family:'Bungee',sans-serif}
  .knob-wrap{display:flex;flex-direction:column;align-items:center}

  .vol-wrap{display:flex;align-items:center;gap:8px;color:#1a140a}
  .vol-wrap .vico{font-size:1.3rem;opacity:.7}
  input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:8px;border-radius:6px;
    background:#1a140a;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--tang);box-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--tang);cursor:pointer}
  .speaker{flex:0 0 auto;width:48px;align-self:stretch;border-radius:10px;margin-left:2px;
    background:radial-gradient(#000 1px,transparent 1.4px) 0 0/7px 7px,linear-gradient(160deg,var(--wood-1),var(--wood-2));
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.3)}

  /* bottom info bar */
  .now-bar{margin-top:1.4rem;font-size:1.25rem;text-align:center;letter-spacing:.05em;max-width:640px}
  .now-bar .lbl{color:var(--tang)}
  .now-bar .ttl{color:var(--aqua)}
  .upnext{font-size:1rem;opacity:.7;margin-top:.25rem}
  .upnext .nx{color:var(--sherbet)}

  /* progress through current show */
  .prog{width:min(94vw,640px);height:6px;border-radius:4px;background:rgba(255,255,255,.12);
    margin-top:.9rem;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sherbet),var(--tang));transition:width .5s linear}

  .hint{margin-top:1rem;font-size:1rem;opacity:.55;text-align:center;letter-spacing:.05em}
  .hint kbd{background:#000;border:1px solid #444;border-radius:4px;padding:0 .35em;color:var(--aqua)}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#000;border:1px solid var(--aqua);color:var(--aqua);padding:.4rem 1rem;border-radius:8px;
    font-size:1.1rem;opacity:0;transition:.3s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* phones: stack the control rail under the screen as a horizontal bar */
  @media (max-width:560px){
    body{padding:1.2rem .6rem}
    .tagline{margin-bottom:1.1rem}
    .tv{padding:16px;border-radius:22px}
    .deck{flex-direction:column;gap:12px}
    .screen-bay{order:1}
    .rail{order:2;flex-basis:auto;flex-direction:row;flex-wrap:wrap;
      justify-content:center;align-items:center;gap:16px;padding:2px 0}
    .pbtn{width:54px;height:54px;font-size:1.35rem}
    .brand-plate{display:none}
    .speaker{display:none}
    .knobs{flex-wrap:wrap;justify-content:center;gap:18px}
    .knob{width:46px;height:46px}
    .knob::after{height:14px}
    .vol-wrap{flex:1 1 100%;justify-content:center;margin-top:4px}
    input[type=range]{width:62vw;max-width:260px;height:12px}
    input[type=range]::-webkit-slider-thumb{width:24px;height:24px}
    input[type=range]::-moz-range-thumb{width:24px;height:24px}
    .guide-row{padding:10px 8px;font-size:1.25rem}
    .now-bar{font-size:1.15rem}
    .hint{display:none}            /* keyboard shortcuts irrelevant on touch */
  }
  /* don't let iOS double-tap-zoom fight the controls */
  .pbtn,.knob,.guide-row,input[type=range],.vol-wrap,.screen{touch-action:manipulation}
  @media (prefers-reduced-motion:reduce){
    .screen .vig,.live-dot,body::before{animation:none}
    #static{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="logo"><span class="sat">SATURDAY</span><span class="box">BOX</span></h1>
  <p class="tagline">cartoons. all day. forever.</p>

  <div class="tv">
    <div class="deck">
      <div class="screen-bay">
        <div class="screen powered-off" id="screen">
          <div class="ch-bug" id="chBug">02</div>
          <div class="channel-label"><span class="live-dot"></span>CH <span id="chNum">02</span></div>
          <video id="player" playsinline muted></video>
          <canvas id="static"></canvas>
          <div class="feed" id="feed">
            <div class="show-title">SATURDAYBOX</div>
            <div class="show-sub" id="bootMsg">press POWER to tune in…</div>
          </div>

          <div class="guide" id="guide">
            <h2>&#9656; TV GUIDE</h2>
            <div class="rows" id="guideRows"></div>
          </div>

          <div class="scan"></div>
          <div class="vig"></div>
          <div class="glare"></div>
          <div class="flash" id="flash"></div>
        </div>

        <div class="knobs">
          <div class="knob-cluster">
            <div class="knob-wrap">
              <div class="knob" id="knobCh" title="Change channel"></div>
              <div class="knob-lbl">CH</div>
            </div>
            <div class="knob-wrap">
              <div class="knob" id="knobGuide" title="TV guide"></div>
              <div class="knob-lbl">GUIDE</div>
            </div>
          </div>
          <div class="vol-wrap">
            <span class="vico" id="volIco">&#128263;</span>
            <input type="range" id="vol" min="0" max="100" value="0" aria-label="Volume">
          </div>
        </div>
      </div>

      <div class="rail">
        <button class="pbtn power" id="power" title="Power (P)"><span class="ico">&#9211;</span></button>
        <button class="pbtn" id="prevCh" title="Channel down">&#9660;</button>
        <button class="pbtn" id="nextCh" title="Channel up">&#9650;</button>
        <button class="pbtn" id="guideBtn" title="Guide (G)">&#9776;</button>
        <button class="pbtn" id="fs" title="Fullscreen (F)">&#9974;</button>
        <div class="speaker"></div>
        <div class="brand-plate">SATURDAYBOX</div>
      </div>
    </div>
  </div>

  <div class="prog"><i id="progBar"></i></div>
  <div class="now-bar">
    <div><span class="lbl">NOW PLAYING &#9656; </span><span class="ttl" id="nowTitle">&mdash;</span></div>
    <div class="upnext">UP NEXT &#9656; <span class="nx" id="nextTitle">&mdash;</span></div>
  </div>

  <div class="hint">
    <kbd>P</kbd> power &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> channel &nbsp;
    <kbd>&uarr;</kbd><kbd>&darr;</kbd> volume &nbsp; <kbd>M</kbd> mute &nbsp;
    <kbd>G</kbd> guide &nbsp; <kbd>F</kbd> fullscreen
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — edit these for your bucket
   ============================================================ */
const BASE_URL     = "https://pub-70f47726e98e4093b322f3288fc13cb8.r2.dev";    // public R2 base URL (no trailing slash)
const MANIFEST_URL = BASE_URL + "/manifest.json";
const DEMO_IF_NO_BUCKET = true; // falls back to demo only if the bucket/manifest can't be reached

/* manifest.json format (duration in SECONDS, must be accurate for sync):
[
  { "title":"Morning Toons", "file":"morning-toons.mp4", "duration":1320, "channel":"02" },
  { "title":"Robo Rangers",  "file":"robo-rangers.mp4",  "duration":1500, "channel":"05" }
]
   - clips sharing a "channel" are grouped into that channel's loop
============================================================ */

const $ = id => document.getElementById(id);
const player=$('player'), feed=$('feed'), bootMsg=$('bootMsg'), nowTitle=$('nowTitle'),
      nextTitle=$('nextTitle'), chNum=$('chNum'), chBug=$('chBug'), screenEl=$('screen'),
      staticCv=$('static'), flash=$('flash'), guide=$('guide'), guideRows=$('guideRows'),
      progBar=$('progBar'), toast=$('toast'), vol=$('vol'), volIco=$('volIco'),
      powerBtn=$('power');

let schedule=[];        // flat list
let channels=[];        // [{id, items:[...], total}]
let chIndex=0;          // current channel index
let powered=false;
let lastVol=70;

const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
const clockSeconds = ()=> Date.now()/1000;

/* ---------- toast ---------- */
let toastT;
function showToast(msg){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('show'),1400);
}

/* ---------- build channels from flat schedule ---------- */
function buildChannels(list){
  const map=new Map();
  list.forEach((it,i)=>{
    const id = String(it.channel || (i+2)).padStart(2,'0');
    if(!map.has(id)) map.set(id,{id,items:[],total:0});
    const c=map.get(id); c.items.push(it); c.total+=Number(it.duration)||0;
  });
  channels=[...map.values()].filter(c=>c.total>0).sort((a,b)=>a.id.localeCompare(b.id));
}

/* ---------- which clip + offset is "live" on a channel right now ---------- */
function currentSlot(ch){
  if(!ch||!ch.total) return null;
  let offset = clockSeconds() % ch.total;
  for(const item of ch.items){
    const d=Number(item.duration)||0;
    if(offset < d) return {item, seekTo:offset, remaining:d-offset};
    offset -= d;
  }
  return {item:ch.items[0], seekTo:0, remaining:ch.items[0].duration};
}
function upNextOf(ch){
  if(!ch||ch.items.length===0) return null;
  let offset=clockSeconds()%ch.total, idx=0;
  for(let i=0;i<ch.items.length;i++){
    const d=Number(ch.items[i].duration)||0;
    if(offset<d){idx=i;break;} offset-=d;
  }
  return ch.items[(idx+1)%ch.items.length];
}

/* ---------- analog static (canvas) ---------- */
let staticRAF=null;
function paintStatic(){
  const w=staticCv.width=160, h=staticCv.height=120;
  const ctx=staticCv.getContext('2d');
  const img=ctx.createImageData(w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=235;}
  ctx.putImageData(img,0,0);
}
function startStatic(){
  staticCv.classList.add('on');
  if(reduceMotion){paintStatic();return;}
  const loop=()=>{paintStatic();staticRAF=requestAnimationFrame(loop);};
  if(!staticRAF) loop();
}
function stopStatic(){
  staticCv.classList.remove('on');
  if(staticRAF){cancelAnimationFrame(staticRAF);staticRAF=null;}
}

/* ---------- tune the current channel ---------- */
function tuneIn(force){
  if(!powered) return;
  const ch=channels[chIndex];
  const slot=currentSlot(ch);
  if(!slot) return;
  const {item,seekTo}=slot;
  chNum.textContent=ch.id;
  nowTitle.textContent=item.title;
  const nx=upNextOf(ch);
  nextTitle.textContent = nx ? nx.title : '—';

  if(force || player.dataset.file!==item.file){
    player.dataset.file=item.file;
    player.src = item.url || (BASE_URL+"/"+item.file);
    player.load();
    player.addEventListener('loadedmetadata',()=>{
      try{ if(isFinite(seekTo)) player.currentTime=seekTo; }catch(e){}
      player.play().then(()=>{ feed.classList.add('hidden'); stopStatic(); })
                   .catch(()=>{ feed.classList.add('hidden'); stopStatic(); });
    },{once:true});
    player.addEventListener('error',()=>{
      stopStatic(); feed.classList.remove('hidden');
      bootMsg.textContent="no signal — check bucket / manifest";
    },{once:true});
  }
}

/* channel surf with static + flash transition */
function changeChannel(dir){
  if(!powered||channels.length===0) return;
  chIndex=(chIndex+dir+channels.length)%channels.length;
  const ch=channels[chIndex];
  chNum.textContent=ch.id;
  chBug.textContent=ch.id; chBug.classList.add('show');
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  startStatic();
  showToast("CH "+ch.id);
  clearTimeout(changeChannel._t);
  changeChannel._t=setTimeout(()=>{
    tuneIn(true);
    setTimeout(()=>chBug.classList.remove('show'),900);
  }, reduceMotion?100:420);
}

/* ---------- power ---------- */
function setPower(on){
  powered=on;
  powerBtn.classList.toggle('on',on);
  screenEl.classList.toggle('powered-off',!on);
  if(on){
    feed.classList.remove('hidden');
    bootMsg.textContent="tuning in…";
    startStatic();
    showToast("POWER ON");
    setTimeout(()=>tuneIn(true), reduceMotion?100:600);
  }else{
    stopStatic();
    player.pause();
    feed.classList.remove('hidden');
    bootMsg.textContent="press POWER to tune in…";
    nowTitle.textContent="—"; nextTitle.textContent="—";
    progBar.style.width="0%";
    showToast("POWER OFF");
  }
}

/* ---------- volume ---------- */
function applyVolume(v){
  v=Math.max(0,Math.min(100,v));
  vol.value=v;
  player.volume=v/100;
  player.muted = v===0;
  volIco.innerHTML = v===0 ? "&#128263;" : v<50 ? "&#128265;" : "&#128266;";
}
vol.addEventListener('input',e=>{ const v=+e.target.value; if(v>0)lastVol=v; applyVolume(v); if(powered)player.play().catch(()=>{}); });
volIco.addEventListener('click',()=> applyVolume(player.muted||+vol.value===0 ? lastVol : 0));

/* ---------- TV guide ---------- */
function renderGuide(){
  guideRows.innerHTML="";
  channels.forEach((ch,i)=>{
    const slot=currentSlot(ch);
    const row=document.createElement('div');
    row.className="guide-row"+(i===chIndex?" live":"");
    row.innerHTML=`<span class="gch">CH ${ch.id}</span>
      <span class="gtt">${slot?slot.item.title:'—'}</span>
      ${i===chIndex?'<span class="gnow">● LIVE</span>':''}`;
    row.addEventListener('click',()=>{
      const dir = i>chIndex?1:-1, steps=Math.abs(i-chIndex);
      if(steps===0){toggleGuide(false);return;}
      chIndex=i-dir; changeChannel(dir);
      toggleGuide(false);
    });
    guideRows.appendChild(row);
  });
}
function toggleGuide(force){
  const open = force!==undefined?force:!guide.classList.contains('open');
  if(open){ if(!powered) return; renderGuide(); }
  guide.classList.toggle('open',open);
}

/* ---------- drift correction + HUD tick ---------- */
setInterval(()=>{
  if(!powered) return;
  const ch=channels[chIndex];
  const slot=currentSlot(ch);
  if(!slot) return;
  if(player.dataset.file!==slot.item.file){ tuneIn(); return; }
  if(Math.abs(player.currentTime-slot.seekTo)>2 && isFinite(slot.seekTo)){
    try{ player.currentTime=slot.seekTo; }catch(e){}
  }
},5000);

setInterval(()=>{
  if(!powered) return;
  const ch=channels[chIndex];
  const slot=currentSlot(ch);
  if(!slot) return;
  const d=Number(slot.item.duration)||1;
  progBar.style.width=Math.min(100,((d-slot.remaining)/d)*100)+"%";
  if(guide.classList.contains('open')) renderGuide();
},1000);

player.addEventListener('ended',()=>tuneIn(true));

/* ---------- controls wiring ---------- */
powerBtn.addEventListener('click',()=>setPower(!powered));
$('nextCh').addEventListener('click',()=>changeChannel(1));
$('prevCh').addEventListener('click',()=>changeChannel(-1));
$('knobCh').addEventListener('click',()=>changeChannel(1));
$('guideBtn').addEventListener('click',()=>toggleGuide());
$('knobGuide').addEventListener('click',()=>toggleGuide());
$('fs').addEventListener('click',toggleFs);
screenEl.addEventListener('dblclick',toggleFs);

function toggleFs(){
  const el=document.querySelector('.tv');
  if(document.fullscreenElement){ document.exitFullscreen?.(); return; }
  if(el.requestFullscreen){ el.requestFullscreen(); }
  else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
  else if(player.webkitEnterFullscreen){ player.webkitEnterFullscreen(); } // iOS Safari: fullscreen the video
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  switch(e.key){
    case 'p':case 'P': setPower(!powered); break;
    case 'ArrowRight': changeChannel(1); break;
    case 'ArrowLeft':  changeChannel(-1); break;
    case 'ArrowUp':   e.preventDefault(); applyVolume((+vol.value)+10); if(+vol.value>0)lastVol=+vol.value; break;
    case 'ArrowDown': e.preventDefault(); applyVolume((+vol.value)-10); break;
    case 'm':case 'M': applyVolume(player.muted||+vol.value===0?lastVol:0); break;
    case 'g':case 'G': toggleGuide(); break;
    case 'f':case 'F': toggleFs(); break;
    case 'Escape': toggleGuide(false); break;
  }
});

/* ---------- demo schedule (used if bucket is unconfigured) ---------- */
function demoSchedule(){
  // Tiny public-domain sample clips so the box visibly "plays" with no bucket.
  const SAMP="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
  return [
    {title:"Morning Toons",   channel:"02", duration:60, url:SAMP+"ForBiggerJoyrides.mp4"},
    {title:"Robo Rangers",    channel:"02", duration:60, url:SAMP+"ForBiggerEscapes.mp4"},
    {title:"Critter Cafe",    channel:"05", duration:60, url:SAMP+"ForBiggerFun.mp4"},
    {title:"Galaxy Patrol",   channel:"05", duration:60, url:SAMP+"ForBiggerBlazes.mp4"},
    {title:"Sunday Funnies",  channel:"08", duration:15, url:SAMP+"ForBiggerMeltdowns.mp4"},
    {title:"Late Late Toons", channel:"08", duration:594, url:SAMP+"BigBuckBunny.mp4"},
  ];
}

/* ---------- boot ---------- */
async function boot(){
  let list=null;
  if(!BASE_URL.includes("YOUR-BUCKET")){
    try{
      const res=await fetch(MANIFEST_URL,{cache:"no-store"});
      if(!res.ok) throw new Error("manifest "+res.status);
      list=await res.json();
    }catch(err){ console.error(err); }
  }
  if((!list||!list.length) && DEMO_IF_NO_BUCKET){
    list=demoSchedule();
    bootMsg.textContent="DEMO MODE — press POWER";
  }
  if(!list||!list.length){
    bootMsg.textContent="no signal — check bucket / manifest";
    return;
  }
  schedule=list;
  buildChannels(list);
  // default starting volume off (so autoplay works); user opens sound via slider/M
  applyVolume(0);
}
boot();
</script>
